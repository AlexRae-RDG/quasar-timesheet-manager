# Builds the native macOS and Windows QUASAR Timesheet Manager app (the
# Tauri rebuild in tauri-app/) and attaches installers to a GitHub Release,
# so colleagues can just download a ready-to-run copy instead of installing
# Node/Rust or building anything themselves.
#
# Fires automatically whenever a tag like "v1.10.0" is pushed (see the
# "Cutting a release" section in the README for the exact commands), or
# can be run by hand from the Actions tab ("Run workflow") for testing --
# a manual run still builds both platforms, it just uploads them as
# workflow artifacts instead of attaching to a Release, since there's no
# tag to attach one to.
#
# This used to build the old Python/Tkinter app instead (via
# packaging/build_macos.sh / build_windows.bat) -- that app has been
# replaced by this Tauri rewrite, so this workflow now builds that.
name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write # needed to create/update the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Universal binary (Intel + Apple Silicon in one .app) rather
            # than picking one -- colleagues are on a mix of both, and a
            # single download that just works on either beats guessing.
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      # Builds via `tauri build` under the hood and, only when triggered by
      # a tag push (tagName/releaseName set below), creates or updates a
      # GitHub Release for that tag and uploads every bundle it produced
      # (macOS: .dmg + .app.tar.gz; Windows: NSIS .exe installer only --
      # tauri.conf.json's bundle.targets deliberately excludes msi, since
      # nobody's ever actually installed from it and every colleague is on
      # the .exe already; one less confusing file in the Release) -- left
      # as a draft so the Release only goes live once both platforms'
      # jobs have finished and someone's clicked Publish, rather than
      # colleagues seeing a release with just one OS's build attached
      # while the other is still running.
      #
      # TAURI_SIGNING_PRIVATE_KEY signs the update artifacts with the
      # keypair whose public half lives in tauri.conf.json's
      # plugins.updater.pubkey -- the in-app updater (src/api/updater.ts)
      # refuses anything that doesn't verify against that key, so losing
      # this secret means generating a new keypair and re-pointing
      # tauri.conf.json at it (see "Cutting a release" in the README).
      # includeUpdaterJson makes this step also generate and attach
      # latest.json, aggregating both platforms' signed artifacts into the
      # one manifest tauri.conf.json's updater endpoint polls.
      - name: Build and (on a tag) release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Manual/test runs (no tag) don't get a Release to attach to -- upload
      # the same bundles as workflow artifacts instead, so the build can
      # still be downloaded and sanity-checked.
      - name: Upload build (manual/test runs without a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: QUASAR-Timesheet-Manager-${{ matrix.platform }}
          path: |
            tauri-app/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri-app/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            tauri-app/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: ignore

  # Three things every release needs that tauri-action doesn't do on its
  # own: 1) a written description of what changed, generated from commit
  # messages since the previous tag, since tauri-action leaves the Release
  # body empty; 2) installer filenames that say which OS they're for
  # (tauri-action names each bundle after productName+version+arch, e.g.
  # "QUASAR.Timesheet.Manager_2.0.8_x64-setup.exe" -- meaningless to a
  # non-technical colleague deciding which one is theirs); 3) dropping the
  # redundant .sig files (see below). Runs after both matrix legs (needs:
  # build) so it only touches the shared draft Release once both platforms
  # have finished uploading their own assets to it -- all three in one job
  # since each mutates the same Release and shouldn't race the others.
  finalize-release-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, not the default shallow single-commit
          # checkout -- the release-notes step below needs to walk back to
          # the previous tag.
          fetch-depth: 0

      - name: Set release notes from commit history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -1)
          RANGE=$([ -n "$PREV_TAG" ] && echo "${PREV_TAG}..${TAG}" || echo "$TAG")
          # "Bump version to x.y.z" is the one commit every release has and
          # says nothing a reader doesn't already know from the tag itself
          # -- filtered out so it doesn't crowd out the notes that do.
          NOTES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' | grep -v '^- Bump version to ')
          if [ -z "$NOTES" ]; then
            NOTES="No notable changes."
          fi
          gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"

      - name: Rename installers for clarity, drop redundant .sig files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # GET /repos/{owner}/{repo}/releases/tags/{tag} only resolves a
          # PUBLISHED release -- this Release is still a draft at this point
          # (see releaseDraft: true above), which has no real tag association
          # yet, so that endpoint 404s and this whole step silently does
          # nothing (confirmed the hard way: it looked like it worked when
          # first tested against what turned out to be an already-published
          # release, then quietly no-op'd on the very next real draft).
          # Listing all releases and matching tag_name works for drafts too.
          RELEASE_ID=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "No release found for tag $TAG" >&2
            exit 1
          fi

          # Every asset below is looked up by its REST numeric id (this
          # release's own id above, and each asset's own id) -- gh release
          # view's GraphQL-style id doesn't work with the PATCH/DELETE
          # endpoints used here. A listing taken right after this job
          # finishes can still lag a few seconds behind, so don't treat
          # `gh release view`/`gh api .../releases/tags/...` as a source of
          # truth for a few seconds after this runs.
          MAP_FILE=$(mktemp)
          ASSETS_FILE=$(mktemp)
          # Captured to a file rather than piped straight into the while
          # loop below (`done < <(...)`) -- a failure inside that kind of
          # process substitution does NOT trip `set -e` on the outer
          # script, so an API error here would silently skip the whole
          # rename with the job still reporting success (exactly how the
          # releases/tags/{tag} 404 above went unnoticed the first time).
          # This way a failure here stops the job for real.
          gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.assets[] | [.id, .name] | @tsv' >"$ASSETS_FILE"
          if [ ! -s "$ASSETS_FILE" ]; then
            echo "No assets found on release $TAG (id $RELEASE_ID) -- expected at least the installers tauri-action just uploaded" >&2
            exit 1
          fi

          while IFS=$'\t' read -r id name; do
            case "$name" in
              *.sig)
                echo "Deleting $name (redundant -- signature is embedded in latest.json, see src/api/updater.ts)"
                gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes || echo "  (already gone)"
                continue
                ;;
              *.app.tar.gz) newname="QUASAR-Timesheet-Manager-Mac-AutoUpdate-${VERSION}.app.tar.gz" ;;
              *.dmg)        newname="QUASAR-Timesheet-Manager-for-Mac-${VERSION}.dmg" ;;
              *-setup.exe)  newname="QUASAR-Timesheet-Manager-for-Windows-${VERSION}.exe" ;;
              *.msi)        newname="QUASAR-Timesheet-Manager-for-Windows-${VERSION}-MSI.msi" ;;
              *) continue ;;
            esac
            if [ "$name" = "$newname" ]; then
              continue
            fi
            echo "Renaming $name -> $newname"
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$newname" >/dev/null
            printf '%s\t%s\n' "$name" "$newname" >>"$MAP_FILE"
          done <"$ASSETS_FILE"

          # latest.json (read by src/api/updater.ts) embeds each platform's
          # download URL by the ORIGINAL filename -- rewrite those to match,
          # or the in-app updater 404s fetching a file that's since been
          # renamed out from under it.
          if [ -s "$MAP_FILE" ]; then
            echo "Patching latest.json's embedded URLs to match the renamed files"
            gh release download "$TAG" --repo "$REPO" -p latest.json -O /tmp/latest.json --clobber
            while IFS=$'\t' read -r old new; do
              old_esc=$(printf '%s' "$old" | sed -e 's/[.[\*^$\/]/\\&/g')
              sed -i "s/\/${old_esc}\"/\/${new}\"/g" /tmp/latest.json
            done <"$MAP_FILE"
            gh release upload "$TAG" /tmp/latest.json --repo "$REPO" --clobber
          fi
