# Builds the native macOS and Windows QUASAR Timesheet Manager app (the
# Tauri rebuild in tauri-app/) and attaches installers to a GitHub Release,
# so colleagues can just download a ready-to-run copy instead of installing
# Node/Rust or building anything themselves.
#
# Fires automatically whenever a tag like "v1.10.0" is pushed (see the
# "Cutting a release" section in the README for the exact commands), or
# can be run by hand from the Actions tab ("Run workflow") for testing --
# a manual run still builds both platforms, it just uploads them as
# workflow artifacts instead of attaching to a Release, since there's no
# tag to attach one to.
#
# This used to build the old Python/Tkinter app instead (via
# packaging/build_macos.sh / build_windows.bat) -- that app has been
# replaced by this Tauri rewrite, so this workflow now builds that.
name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write # needed to create/update the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Universal binary (Intel + Apple Silicon in one .app) rather
            # than picking one -- colleagues are on a mix of both, and a
            # single download that just works on either beats guessing.
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      # Builds via `tauri build` under the hood and, only when triggered by
      # a tag push (tagName/releaseName set below), creates or updates a
      # GitHub Release for that tag and uploads every bundle it produced
      # (macOS: .dmg + .app.tar.gz; Windows: NSIS and MSI installers) --
      # left as a draft so the Release only goes live once both platforms'
      # jobs have finished and someone's clicked Publish, rather than
      # colleagues seeing a release with just one OS's build attached
      # while the other is still running.
      #
      # TAURI_SIGNING_PRIVATE_KEY signs the update artifacts with the
      # keypair whose public half lives in tauri.conf.json's
      # plugins.updater.pubkey -- the in-app updater (src/api/updater.ts)
      # refuses anything that doesn't verify against that key, so losing
      # this secret means generating a new keypair and re-pointing
      # tauri.conf.json at it (see "Cutting a release" in the README).
      # includeUpdaterJson makes this step also generate and attach
      # latest.json, aggregating both platforms' signed artifacts into the
      # one manifest tauri.conf.json's updater endpoint polls.
      - name: Build and (on a tag) release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Manual/test runs (no tag) don't get a Release to attach to -- upload
      # the same bundles as workflow artifacts instead, so the build can
      # still be downloaded and sanity-checked.
      - name: Upload build (manual/test runs without a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: QUASAR-Timesheet-Manager-${{ matrix.platform }}
          path: |
            tauri-app/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri-app/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            tauri-app/src-tauri/target/**/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: ignore

  # tauri-action names each bundle after productName+version+arch
  # ("QUASAR.Timesheet.Manager_2.0.8_x64-setup.exe"), which doesn't tell a
  # non-technical colleague which file is theirs -- someone who doesn't
  # know what a ".dmg" or ".exe" even is has no way to guess "that one's
  # for my Mac". Runs after both matrix legs (needs: build) so it only
  # touches the shared draft Release once both platforms have finished
  # uploading their own assets to it. Also drops the .sig files here (see
  # below) -- same job since both steps mutate the same Release's asset
  # list and shouldn't race each other.
  finalize-release-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rename installers for clarity, drop redundant .sig files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # gh release view's/gh api releases/tags's own asset listing can lag
          # a few seconds behind a just-completed rename/delete (observed
          # directly while testing this against a real draft release before
          # trusting it here) -- doesn't affect correctness below, since
          # every asset is looked up by its REST numeric id (releases/tags,
          # not gh release view's GraphQL id, which the assets PATCH/DELETE
          # endpoints below don't accept) captured ONCE up front, but it does
          # mean a listing taken right after this job finishes may briefly
          # still show old names.
          MAP_FILE=$(mktemp)

          while IFS=$'\t' read -r id name; do
            case "$name" in
              *.sig)
                echo "Deleting $name (redundant -- signature is embedded in latest.json, see src/api/updater.ts)"
                gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes || echo "  (already gone)"
                continue
                ;;
              *.app.tar.gz) newname="QUASAR-Timesheet-Manager-Mac-AutoUpdate-${VERSION}.app.tar.gz" ;;
              *.dmg)        newname="QUASAR-Timesheet-Manager-for-Mac-${VERSION}.dmg" ;;
              *-setup.exe)  newname="QUASAR-Timesheet-Manager-for-Windows-${VERSION}.exe" ;;
              *.msi)        newname="QUASAR-Timesheet-Manager-for-Windows-${VERSION}-MSI.msi" ;;
              *) continue ;;
            esac
            if [ "$name" = "$newname" ]; then
              continue
            fi
            echo "Renaming $name -> $newname"
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$newname" >/dev/null
            printf '%s\t%s\n' "$name" "$newname" >>"$MAP_FILE"
          done < <(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | [.id, .name] | @tsv')

          # latest.json (read by src/api/updater.ts) embeds each platform's
          # download URL by the ORIGINAL filename -- rewrite those to match,
          # or the in-app updater 404s fetching a file that's since been
          # renamed out from under it.
          if [ -s "$MAP_FILE" ]; then
            echo "Patching latest.json's embedded URLs to match the renamed files"
            gh release download "$TAG" --repo "$REPO" -p latest.json -O /tmp/latest.json --clobber
            while IFS=$'\t' read -r old new; do
              old_esc=$(printf '%s' "$old" | sed -e 's/[.[\*^$\/]/\\&/g')
              sed -i "s/\/${old_esc}\"/\/${new}\"/g" /tmp/latest.json
            done <"$MAP_FILE"
            gh release upload "$TAG" /tmp/latest.json --repo "$REPO" --clobber
          fi
